# kernel-requirements.conf — the kernel configuration of the workpod image (SP-A02-2, AB-E01-1).
#
# E-01 rules the Fedora kernel, so this is not a `.config` that gets compiled. It is the list of
# options the image is checked against, and acceptance/e01-kernel.sh is that check. Why a
# requirements file is the right reading of "the kernel configuration is a file in the repository",
# and where the two differ, stands in decisions/kernel-configuration.md.
#
# Grammar — one requirement per line, four keywords. The `CONFIG_` prefix is implied, so a symbol
# reads the way the specification writes it:
#
#   require     <SYMBOL> y              built into the kernel
#   require     <SYMBOL> m <module>     built in, or a module — and then that module must be in the
#                                       image. The check normalises `-` and `_` in module names.
#   require-one <group> <SYMBOL> <y|m> <module>
#                                       one satisfied line per group is enough
#   unset       <SYMBOL>                must not be set
#   exclude     <path>                  no module may be installed under
#                                       /usr/lib/modules/<kver>/<path>
#
# The mechanism behind the `exclude` lines is `KernelModules=` in mkosi.conf together with the
# package list, which installs neither kernel-modules nor kernel-modules-extra. Requirement and
# mechanism are deliberately in two files: if the mechanism forgets one, the module is in the image
# and this file's check says so.

# --------------------------------------------------------------------------------------------
# cgroup v2 unified and PSI — R-A schedules by them and R-C reads pressure; both fall without them
# --------------------------------------------------------------------------------------------
require CGROUPS y
require MEMCG y
require CGROUP_SCHED y
require FAIR_GROUP_SCHED y
require CFS_BANDWIDTH y
require CGROUP_PIDS y
require BLK_CGROUP y
require PSI y
# PSI compiled in but off by default needs `psi=1` on the command line to produce /proc/pressure.
# R-C reads pressure without one, so the default has to be on.
unset PSI_DEFAULT_DISABLED

# --------------------------------------------------------------------------------------------
# overlayfs — the writable layer of a pod (T-04)
# --------------------------------------------------------------------------------------------
require OVERLAY_FS m overlay

# --------------------------------------------------------------------------------------------
# btrfs or XFS with reflink — SP-A05-2. One of the two suffices; AB-A06-2 measures that the
# snapshot it gives is O(1).
# --------------------------------------------------------------------------------------------
require-one reflink BTRFS_FS m btrfs
require-one reflink XFS_FS m xfs

# --------------------------------------------------------------------------------------------
# user namespaces, seccomp, Landlock — the three walls around a pod (T-04)
# --------------------------------------------------------------------------------------------
require USER_NS y
require SECCOMP y
require SECCOMP_FILTER y
require SECURITY_LANDLOCK y

# --------------------------------------------------------------------------------------------
# zram with zstd — the compressed pages of frozen pods (R-C, and the factor E-05 measures)
# --------------------------------------------------------------------------------------------
require ZRAM m zram
require ZRAM_BACKEND_ZSTD y

# --------------------------------------------------------------------------------------------
# checkpoint/restore — rung 4 of the ladder in R-C. This is the line E-01 hangs on: the option
# being set is necessary and not sufficient, AB-A06-5 measures whether CRIU actually works.
# --------------------------------------------------------------------------------------------
require CHECKPOINT_RESTORE y

# --------------------------------------------------------------------------------------------
# KVM — both vendors, because SP-A02-1 ships one artifact for every host
# --------------------------------------------------------------------------------------------
require KVM m kvm
require KVM_INTEL m kvm_intel
require KVM_AMD m kvm_amd

# --------------------------------------------------------------------------------------------
# io_uring
# --------------------------------------------------------------------------------------------
require IO_URING y

# --------------------------------------------------------------------------------------------
# Not from SP-A02-2 but from this image's own shape: the root is erofs under dm-verity
# (SP-E01-1, and the erofs ruling in mkosi.repart/10-root.conf). Without these the image does not
# boot at all, so they belong in the same list rather than in a comment somewhere.
# --------------------------------------------------------------------------------------------
require EROFS_FS m erofs
require BLK_DEV_DM m dm_mod
require DM_VERITY m dm_verity

# --------------------------------------------------------------------------------------------
# Out (SP-A02-2). "Unused filesystems, sound, legacy drivers" — the filesystems name themselves;
# which drivers count as legacy is a judgement, and it is ruled in
# decisions/kernel-configuration.md rather than derived from the specification.
# --------------------------------------------------------------------------------------------
exclude kernel/sound

exclude kernel/drivers/parport
exclude kernel/drivers/pcmcia
exclude kernel/drivers/memstick
exclude kernel/drivers/w1
exclude kernel/drivers/gpib

exclude kernel/fs/9p
exclude kernel/fs/afs
exclude kernel/fs/ceph
exclude kernel/fs/exfat
exclude kernel/fs/f2fs
exclude kernel/fs/isofs
exclude kernel/fs/lockd
exclude kernel/fs/nfs
exclude kernel/fs/nfsd
exclude kernel/fs/ntfs3
exclude kernel/fs/ocfs2
exclude kernel/fs/orangefs
exclude kernel/fs/smb
exclude kernel/fs/squashfs
exclude kernel/fs/udf
exclude kernel/fs/vboxsf
exclude kernel/fs/zonefs
