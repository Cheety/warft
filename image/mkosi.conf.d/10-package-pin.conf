# The pinned package set (SP-E01-2).
#
# `LocalMirror=` makes mkosi use exactly one repository instead of the distribution's usual set.
# Pointed at a released Fedora tree, that is a package snapshot: release trees are frozen at GA and
# never change afterwards — the repodata for 43 was last written on 2025-10-23 and has not moved
# since. A rebuild months from now therefore resolves the same NEVRAs.
#
# Why not `Snapshot=`, which reads like the setting for exactly this: on Fedora, mkosi accepts it
# only together with `Release=rawhide` (mkosi/distribution/fedora.py). Rawhide is the development
# branch; taking it as the base of a platform whose security pipeline A-01 relies on would trade the
# reason for choosing Fedora against a setting name.
#
# What this leaves out is the `updates` repository, the only part of a released Fedora that moves.
# That is not a gap but the mechanism: a pinned image does not silently gain packages. Security
# fixes arrive the way A-02 and A-03 already deliver everything else — by bumping the pin,
# rebuilding, comparing, and rolling a new image through the three channels.
#
# Bumping is deliberate work, not maintenance:
#
#   1. point the URL at the new release tree
#   2. rebuild twice, compare
#   3. commit the new URL with the comparison in the message
#
# A bump changes the package set, so it changes the artifact. That is expected. What must not change
# is that two builds of the same pin are identical.

[Distribution]
LocalMirror=https://dl.fedoraproject.org/pub/fedora/linux/releases/43/Everything/x86_64/os
