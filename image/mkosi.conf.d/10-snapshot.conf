# The pinned package snapshot (SP-E01-2).
#
# One koji repository id under https://kojipkgs.fedoraproject.org/repos/f43-build/. It is the whole
# of what "reproducible through a package snapshot held fixed" means: with it, a rebuild months from
# now resolves the same package versions; without it, "does the same thing run on every node" is not
# answerable.
#
# Bumping it is deliberate work, not maintenance:
#
#   mkosi --directory image latest-snapshot     # prints the newest id
#   # write it below, rebuild twice, compare, commit the new id with the comparison in the message
#
# A bump changes the package set, so it changes the artifact. That is expected. What must not change
# is that two builds of the same id are identical.

[Distribution]
Snapshot=6679022
