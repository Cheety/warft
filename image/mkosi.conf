# mkosi.conf — the workpod system image.
#
# AP-0.2 answered one question here: does the image build reproducibly? AP-1.1 adds the content —
# the kernel requirements from SP-A02-2, the userland from SP-A02-3, and a bootable disk whose root
# is read-only under dm-verity (SP-E01-1). The reproducibility machinery below is unchanged and
# still load-bearing: every addition has to survive being built twice.
#
# Reproducibility rests on three mechanisms (SP-E01-2, SP-A03-2):
#
#   1. LocalMirror= pins the package set to one frozen Fedora release tree, so a rebuild resolves
#      the same NEVRAs rather than "whatever is current". Without pinning there is no bit-identical
#      rebuild and half the rationale from A-01 falls. The URL lives in
#      mkosi.conf.d/10-package-pin.conf so that bumping it is one line and one commit.
#   2. SOURCE_DATE_EPOCH clamps file modification times. build.sh derives it from the commit being
#      built, so the timestamp is a property of the revision and not of the day.
#   3. The mkosi version is pinned in tool-version and checked by build.sh before either pass. The
#      build tool is an input to the artifact like any other.
#
# The Fedora release is not fixed by the specification — E-01 rules "Fedora packages with the
# Fedora kernel" and leaves the release open. 43 is one release behind the newest, which is the
# conservative choice for a base whose security pipeline A-01 relies on.

[Distribution]
Distribution=fedora
Release=43
Architecture=x86-64
RepositoryKeyCheck=yes

[Output]
Format=disk
ImageId=workpod
OutputDirectory=out
# SP-A03-7: a manifest of everything installed, per image. This is the SBOM the seal step needs.
ManifestFormat=json
# systemd-repart derives partition and filesystem UUIDs from this seed. Without it every mkfs
# invents a fresh UUID, and two builds of the same packages differ in bytes that carry no
# information — which is what the sixth CI run showed: the manifest matched, the disk image did not.
# The value is arbitrary; only its constancy matters.
Seed=8f3a5c21-6b4e-4d7a-9e12-0c5f8a2d3b64
# Write the partitions out on their own as well. It costs a few files and makes the comparison say
# which layer differs: a filesystem, or the GPT wrapper around them. Run 10 narrowed the difference
# to 1761 bytes near the end of the image and could not say which of the two it was in.
SplitArtifacts=partitions

[Validation]
# Verity hash partition, no signature partition. The roothash then lands in the unified kernel
# image's command line, which is what makes the root read-only under dm-verity at boot without a
# key being present at build time — and by decisions/signing-key.md the private key is on no build
# machine. That is the half of SP-A03-3 a damaged image fails against, and AP-1.2 evidences it
# (AB-A03-3, AB-A06-7). Its other sentence — the public key in the boot path — has no work package
# yet; image/README.md says why it is a ruling before it is a partition.
Verity=hash

[Content]
# SP-E01-1. Bootloader and kernel come from the image itself; mkosi assembles a unified kernel
# image per installed kernel and installs systemd-boot in front of it. systemd-boot rather than a
# bare UKI because SP-A03-4 wants A/B with a boot counter, and the counter is systemd-boot's.
Bootable=yes
Bootloader=systemd-boot
# `unsigned` rather than the default `auto` so a missing ukify fails the build instead of quietly
# producing Type 1 boot entries — which would still boot, and would drop the roothash discipline.
UnifiedKernelImages=unsigned

# Two entries besides the roothash mkosi appends.
#
# /var on tmpfs as the floor, not as the answer. Since AP-3.1 the disk step of A-04 mounts the real
# /var — TPM-bound LUKS on the data disk — over it, together with /data/work and /data/db
# (SP-A05-1, platform/internal/disk). The tmpfs is what a node stands on until that step gets
# there, and what it keeps standing on if the step never does: writing node state into a root that
# dm-verity refuses is the alternative, and it is worse. Such a node does not become part of
# anything, because the selftest reads /var's mount source and one still on the tmpfs does not
# register (SP-A04-3). The root itself stays read-only either way, which `systemd.volatile=overlay`
# would not do and AB-A02-1 probes.
#
# And a serial console, because a node has no other way to be looked at: A-04 gives it no SSH and
# no configuration path at runtime (SP-A04-4), so when it fails before it can report, the serial
# line is the only place the failure is visible. It is not a network surface and AB-A06-8 does not
# see it. Run 19 is the argument: the machine ran for ten minutes and said nothing at all, because
# everything that could have spoken was writing to a console that was not connected to anything.
KernelCommandLine=systemd.volatile=state console=ttyS0,115200n8

# SP-A02-2's "Out". A module that is not in the image cannot be loaded; that is the whole mechanism.
# The requirement these lines serve stands in kernel-requirements.conf, and acceptance/e01-kernel.sh
# fails when the two drift apart — which is why the list is not generated from the other file.
#
# The leading `*` is not decoration: mkosi keeps only what a positive pattern matched, so a list of
# nothing but exclusions would empty the module tree.
#
# Excluding a directory is not the whole of excluding what lives in it. mkosi filters first and then
# resolves dependencies, and that second pass adds a filtered-out module straight back when anything
# that survived the filter depends on it (mkosi/kmod.py, resolve_module_dependencies). Run 21 found
# `parport` in the image for exactly that reason: four parallel port drivers sit outside
# kernel/drivers/parport and each one names it as a dependency. They are legacy drivers in
# SP-A02-2's sense, so they are excluded here as well — and with the last dependent gone, parport is
# dropped rather than dragged back. The requirement is stated in kernel-requirements.conf, where
# `absent` names the four; this is only the mechanism.
KernelModules=
        *
        -/sound/
        -/drivers/parport/
        -/drivers/char/lp
        -/drivers/char/ppdev
        -/drivers/i2c/busses/i2c-parport
        -/drivers/pps/clients/pps_parport
        -/drivers/pcmcia/
        -/drivers/memstick/
        -/drivers/w1/
        -/drivers/gpib/
        -/fs/9p/
        -/fs/afs/
        -/fs/ceph/
        -/fs/exfat/
        -/fs/f2fs/
        -/fs/isofs/
        -/fs/lockd/
        -/fs/nfs/
        -/fs/nfsd/
        -/fs/ntfs3/
        -/fs/ocfs2/
        -/fs/orangefs/
        -/fs/smb/
        -/fs/squashfs/
        -/fs/udf/
        -/fs/vboxsf/
        -/fs/zonefs/

# The initrd takes mkosi's own curated set instead of the image's whole module tree: it needs erofs
# and dm-verity to open the root at all, and virtio to find the disk, and nothing else. Left
# unset it would carry every module in the image.
KernelInitrdModules=default

Locale=C.UTF-8
# SP-A02-3: no man pages. Stated here so it is a property of the build, not of a later cleanup.
WithDocs=no
CleanPackageMetadata=yes
# The platform binary (SP-E02-1: one statically linked Go binary; SP-A02-3 puts it in the
# userland). It is built by build.sh before either pass and staged into this tree, so both passes
# embed the identical file and the reproducibility comparison keeps meaning something. mkosi.extra
# is named explicitly because setting ExtraTrees= must not cost the default tree that carries the
# role generator and the units.
ExtraTrees=mkosi.extra
        .build/platform-tree

# ldconfig's auxiliary cache records timestamps and inode numbers of the libraries it scanned, so it
# differs between two builds of identical content. Run 11 identified it as the only file that
# actually differed: 1876 bytes, in an image otherwise byte-for-byte equal.
#
# Removing it is right beyond reproducibility. The root is read-only under dm-verity (SP-E01-1), so
# a cache that lives there can never be updated and only carries stale inode numbers. ldconfig
# rebuilds it when it is missing.
RemoveFiles=/var/cache/ldconfig/aux-cache

# SP-A02-3. What is not here is as deliberate as what is: no compiler, no Python, no Node, no
# editor, no package manager. AB-A01-1 takes the inventory against the SBOM in AP-1.2.
Packages=
        # the kernel, split the way Fedora splits it: kernel-core is vmlinuz and the configuration,
        # kernel-modules-core the modules SP-A02-2 asks for. kernel-modules and
        # kernel-modules-extra are not installed — that is half of the "Out" list.
        kernel-core
        kernel-modules-core

        # SP-A02-4: systemd is not replaced. It carries the slice hierarchy, socket activation and
        # cgroup management for R-A and R-C.
        systemd
        systemd-udev
        systemd-boot-unsigned

        # the container runtime (SP-A02-3, SP-E02-3). runsc is not here: gVisor runs pods at level
        # `public` and arrives with AP-5.7.
        containerd
        runc

        # the filesystem with reflink (SP-A05-2) and the firewall (SP-A02-3)
        btrfs-progs
        nftables

        # zram. SP-A05-1 gives it a row in the disk layout — "compressed pages of frozen pods" —
        # so the device belongs to the image and not to a host's tuning. The generator turns
        # mkosi.extra/usr/lib/systemd/zram-generator.conf into a swap unit at boot; that file is
        # where zstd is chosen, because the kernel's own default is lzo-rle. Only the generator is
        # installed, not zram-generator-defaults: the size and the algorithm are decisions here
        # (AB-A06-4, and the factor AP-1.3 measures).
        zram-generator

        # time synchronization. SP-A04-5 puts the clock before enrollment and K-04 makes leases and
        # token expiry functions of it, so a node with a wrong clock is wrong plausibly.
        chrony

        # checkpoint/restore. Not named in SP-A02-3, but E-01's rationale rests on CRIU being a
        # Fedora package, and AB-A06-5 — the row the whole of stage 1 hangs on — cannot run without
        # it in the image.
        criu

        # what a shell script needs to exist. A-06 ships as a script and runs on the node itself
        # (SP-A06-1), so bash, the coreutils it calls, awk, grep, `sysctl` and `ss` are image
        # content, not developer convenience. None of them is a toolchain.
        bash
        coreutils
        gawk
        grep
        procps-ng
        iproute
        util-linux

        # the patch a pod delivers (SP-T04-4: "deliver a patch and a report"). The runner computes
        # it on the host from the base subvolume and the pod's snapshot — outside the pod, so that
        # what changed is measured rather than claimed — and `diff -ruN` is what computes it.
        # coreutils does not carry diff.
        diffutils

        # the state database (SP-A02-3 "the state database", SP-E02-2: Postgres as the only one,
        # the queue inside it). workpod-db.service runs it on /data/db — the one area of
        # SP-A05-1's layout that survives a reinstall.
        postgresql-server

        # the disk step's encryption of /var (SP-A05-4: a TPM binding, not a passphrase).
        # cryptsetup formats, systemd-cryptenroll (systemd-udev) binds the key to the TPM, and
        # tpm2-tss is the library it speaks TPM 2.0 through. On a machine without a TPM the step
        # says so and leaves /var plain — AB-A05-4 (AP-6.1) is the row that measures the binding.
        cryptsetup
        tpm2-tss

[Build]
# Incremental caches would make the second build read a tree the first one wrote, which would prove
# nothing about reproducibility. History likewise records state across runs.
Incremental=no
History=no

# The ESP was the last thing in the image that still carried a clock. Run 16 differed in two bytes
# of 512 MB, run 17 named them: the creation time and the write time of the `ESP` volume label
# entry, the first directory entry of the FAT root directory. mkfs.fat writes it, and Fedora 43
# ships dosfstools 4.2, which does not read SOURCE_DATE_EPOCH at all — systemd passes that variable
# to mcopy, which is why every file it copied in was already stable, but not to a tool that cannot
# use it.
#
# `--invariant` is dosfstools' own answer: constants instead of randomly generated or time based
# values. It costs the seed-derived volume ID, because it is appended after systemd-repart's `-i`
# and overrides it with a fixed one — a constant traded for a clock, which is the right way round.
# Nothing reads that ID; systemd-boot finds the ESP by its partition type.
Environment=SYSTEMD_REPART_MKFS_OPTIONS_VFAT=--invariant
