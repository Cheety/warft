# mkosi.conf — the build environment (AP-0.2).
#
# This work package answers one question and no other: does the image build reproducibly?
# No roles, no units, no kernel requirements — those are AP-1.1 (SP-A02-2, SP-A02-3).
#
# Reproducibility here is not an ideal but the check from G-06 applied to the operating system
# (SP-E01-2, SP-A03-2). Three mechanisms carry it:
#
#   1. LocalMirror= pins the package set to one frozen Fedora release tree, so a rebuild resolves
#      the same NEVRAs rather than "whatever is current". Without pinning there is no bit-identical
#      rebuild and half the rationale from A-01 falls. The URL lives in
#      mkosi.conf.d/10-package-pin.conf so that bumping it is one line and one commit.
#   2. SOURCE_DATE_EPOCH clamps file modification times. build.sh derives it from the commit being
#      built, so the timestamp is a property of the revision and not of the day.
#   3. The mkosi version is pinned in mkosi.version and checked by build.sh before either pass. The
#      build tool is an input to the artifact like any other.
#
# The Fedora release is not fixed by the specification — E-01 rules "Fedora packages with the
# Fedora kernel" and leaves the release open. 43 is one release behind the newest, which is the
# conservative choice for a base whose security pipeline A-01 relies on.

[Distribution]
Distribution=fedora
Release=43
Architecture=x86-64
RepositoryKeyCheck=yes

[Output]
Format=disk
ImageId=workpod
OutputDirectory=out
# SP-A03-7: a manifest of everything installed, per image. This is the SBOM the seal step needs.
ManifestFormat=json

[Content]
# Bootable comes in AP-1.1 together with the kernel requirements from A-02. Here the artifact only
# has to be produced twice and be identical both times.
Bootable=no
Locale=C.UTF-8
# SP-A02-3: no man pages. Stated here so it is a property of the build, not of a later cleanup.
WithDocs=no
CleanPackageMetadata=yes
Packages=
        systemd
        util-linux

[Build]
# Incremental caches would make the second build read a tree the first one wrote, which would prove
# nothing about reproducibility. History likewise records state across runs.
Incremental=no
History=no
