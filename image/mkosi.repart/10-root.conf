# The root partition (AP-0.2).
#
# This replaces the definition mkosi generates by default, which is identical except that it takes
# the filesystem from the distribution — btrfs for Fedora. Everything else here is mkosi's own
# default, kept deliberately so that the one deviation is visible.
#
# Why not btrfs. The ninth CI run measured the difference between two passes: 37,320 bytes of
# 207,638,528, with the first at offset 0x110000 — the partition starts at 1 MiB and the btrfs
# superblock sits 64 KiB into it. So the difference is btrfs metadata: generation and transid
# counters, tree roots, block checksums. Those are not derived from Seed= and are not stable across
# two mkfs runs of the same content. 0.018 % of the image, and enough to make the comparison
# meaningless.
#
# Why erofs. The system partition is read-only under dm-verity (SP-E01-1, SP-A05-1) — a read-write
# filesystem there buys nothing and costs determinism. erofs is built for read-only images, and
# mkosi itself uses it for exactly this shape: its sysext and confext definitions ship
# `Format=erofs` with `Verity=data`.
#
# This does not touch SP-A05-2. Reflink is required for /data/work, where T-04 takes CoW snapshots
# in O(1) and AB-A06-2 measures it. The read-only root never snapshots anything.
#
# `Verity=data` (AP-1.1) makes this the data half of a verity pair; 20-root-verity.conf is the hash
# half, and VerityMatchKey= is what joins them. systemd-repart then derives both partition UUIDs
# from the roothash instead of from Seed=, which is a stronger form of the same determinism: the
# identity of the partition becomes a function of its content.

[Partition]
Type=root
Format=erofs
CopyFiles=/
Minimize=guess
Verity=data
VerityMatchKey=root
