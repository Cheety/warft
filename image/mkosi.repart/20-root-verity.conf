# The verity hash tree of the root partition (AP-1.1, SP-E01-1, SP-A03-3).
#
# "Verity or nothing at all" (SP-A03-3). This partition holds the Merkle tree over the erofs
# partition next to it; the root of that tree — the roothash — goes into the unified kernel image's
# command line, where mkosi puts it automatically. At boot the initrd opens the root through
# dm-verity against that hash, so every block is checked as it is read and a modified image stops
# rather than runs.
#
# VerityMatchKey= joins this partition to the one in 10-root.conf. The pair is what
# systemd-repart needs to compute the tree; the key itself never appears in the image.
#
# What is missing is the third file of the usual triple, a `Verity=signature` partition. Signing the
# roothash needs the private key at build time, and by decisions/signing-key.md that key is on no
# build machine. Verity=hash in mkosi.conf says so explicitly. AP-1.2 evidenced the half of SP-A03-3
# that a damaged image fails against; the half where the public key enters the boot path is an open
# question and not a scheduled step — image/README.md, "Verity, and what the ESP is for".

[Partition]
Type=root-verity
Verity=hash
VerityMatchKey=root
Minimize=best
