# The EFI system partition (AP-1.1).
#
# Identical to the definition mkosi generates when no repart directory is configured. It has to be
# written out here because configuring mkosi.repart/ at all replaces mkosi's defaults wholesale —
# the root partition needed a different filesystem (see 10-root.conf), and this partition came with
# it.
#
# What lands here is systemd-boot and one unified kernel image per installed kernel. The UKI
# carries the kernel command line, and with it the verity roothash mkosi appends — which is why the
# ESP is the only writable partition of the image and still cannot be used to change what runs:
# a modified root no longer matches the hash in the boot path (SP-A03-3).
#
# 512 MB is mkosi's own size and is not tight: a UKI with the initrd from KernelInitrdModules= is
# tens of megabytes, and SP-A03-4's A/B keeps two of them side by side from AP-6.4 on.

[Partition]
Type=esp
Format=vfat
CopyFiles=/boot:/
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
