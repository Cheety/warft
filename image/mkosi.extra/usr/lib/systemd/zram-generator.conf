# zram — the compressed pages of frozen pods (SP-A05-1, SP-A02-2, R-C).
#
# R-C's ladder freezes a pod before it evicts one: the processes stay alive, the cgroup freezer
# holds them, and their pages are compressed. That last part is this device. It is therefore image
# content and not host tuning — a node nobody has configured must arrive with it, the same argument
# SP-K04-7 makes for the clock.
#
# zstd, said explicitly. The kernel's own default is lzo-rle (CONFIG_ZRAM_DEF_COMP_LZORLE=y in
# Fedora's configuration), and SP-A02-2 names zstd. Leaving the default in place would compress at
# a different ratio than the one R-D's occupancy table plans with, silently — and the ratio is one
# of the five constants AP-1.3 measures. AB-A06-4 checks the algorithm the device actually selected,
# not the one this file asked for.
#
# ram/4 is a planning value like the rest of R-D's, not a tuned one: A-06's last row (the
# calibration run, AP-1.3) measures the pages per frozen pod and the compression factor, and
# decisions/E-05.md is where the measured numbers land. Sizing is revisited there, with numbers.

[zram0]
zram-size = ram / 4
compression-algorithm = zstd
