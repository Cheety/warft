# memory.min on the system slice (SP-RC-4, AP-3.1): the control plane, the proxies and access are
# reserved hard — 4 GB by default (E-05). Under memory pressure the kernel reclaims everywhere
# else first; the plane keeps answering while the work layer is squeezed, which is what AB-RC-4
# probes with a hog and a stopwatch.
#
# The slice carries the budget; the units that are the reservation's point claim it with their
# own MemoryMin=infinity (workpod-control.service, and the gates when AP-3.5 brings them).
# Deliberately NOT DefaultMemoryMin= over every child: protection covers page cache too, and a
# blanket default makes every transient service's cache unreclaimable — on a machine smaller
# than the budget that is the whole of RAM, and run 30221414217 watched a 2 GB machine OOM at
# thirteen seconds over exactly that, holding 1.8 GB of file pages the kernel was forbidden to
# take.

[Slice]
MemoryMin=4G
