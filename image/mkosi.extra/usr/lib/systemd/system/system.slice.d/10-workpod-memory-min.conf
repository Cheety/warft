# memory.min on the system slice (SP-RC-4, AP-3.1): the control plane, the proxies and access are
# reserved hard — 4 GB by default (E-05). Under memory pressure the kernel reclaims everywhere
# else first; the plane keeps answering while the work layer is squeezed, which is what AB-RC-4
# probes with a hog and a stopwatch.
#
# DefaultMemoryMin=infinity is what makes the reservation reach the services: memory.min protects
# a cgroup's own usage, and pages are charged to the leaves. With it, every service under
# system.slice claims up to the slice's 4 GB and the kernel distributes the protection in
# proportion to actual use — the plane is protected because it runs, not because it was sized.

[Slice]
MemoryMin=4G
DefaultMemoryMin=infinity
