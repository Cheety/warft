# AP-0.2 — the CI leg that builds every image twice and compares the artifacts.
#
# This workflow is the only place where AB-A03-2 can turn green: reproducibility is a property of a
# run, not of a configuration file. It fails the build when the two passes differ, so the row cannot
# quietly go unnoticed.
#
# It runs in a Fedora container because mkosi builds Fedora images with Fedora's own package
# tooling, and E-01 rules that the security pipeline stays with Fedora.
#
# mkosi itself is pinned to the version in image/tool-version and taken from its own repository,
# not from `dnf install mkosi`. Two reasons, and the second is the important one:
#   1. Fedora 43 ships 25.3, which lacks settings this configuration uses.
#   2. The build tool is an input to the artifact. A distribution update to mkosi would change the
#      output and break the very claim this leg exists to make. Pinning the packages while leaving
#      the tool floating would be half a pin.
# The distribution package is still installed, for its dependencies.

name: image

on:
  push:
    paths: ['image/**', '.github/workflows/image.yml']
  pull_request:
    paths: ['image/**', '.github/workflows/image.yml']
  workflow_dispatch:

jobs:
  reproducible:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
      # mkosi assembles a disk image: it needs loop devices and mount, which the default container
      # profile denies.
      options: --privileged
    steps:
      # Weak dependencies are installed deliberately: mkosi's recommends are its toolchain, and this
      # is the build container, not the image. SP-A02-3's "no toolchains" is a property of what is
      # built, not of what builds it. distribution-gpg-keys is named explicitly because mkosi asks
      # for it by name when a repository signature cannot be checked. erofs-utils provides
      # mkfs.erofs, which the root partition definition needs.
      - name: Install the build dependencies
        run: dnf -y install mkosi git-core systemd-udev distribution-gpg-keys erofs-utils openssl

      # fetch-depth: 0 because build.sh dates the image from the last commit that touched image/,
      # not from HEAD. A shallow checkout has one commit, and on a run triggered by a change to this
      # workflow that commit does not touch image/ — the build would then have no date at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pin mkosi to the version in image/tool-version
        run: |
          set -eu
          v="$(cat image/tool-version)"
          git clone --depth 1 --branch "v$v" https://github.com/systemd/mkosi /opt/mkosi
          echo /opt/mkosi/bin >> "$GITHUB_PATH"

      - name: Build twice and compare
        run: ./image/build.sh

      # No signing key is available here and none is wanted: decisions/signing-key.md keeps the
      # private half off every build machine, so this leg verifies with the committed certificate
      # alone. Exit 2 means the revision has not been sealed yet, which is the normal state while
      # the image is still being built (AP-1.1) — it is reported, not failed. Exit 1 means a seal
      # exists and does not hold, and that must stop the run.
      - name: Verify the seal
        run: |
          set +e
          ./image/verify.sh
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::AB-A03-7 evidenced by this run — SBOM and signature verified" ;;
            2) echo "::warning::image unsealed for this revision — AB-A03-7 stays red (image/seal.sh)" ;;
            *) echo "::error::the seal does not hold"; exit 1 ;;
          esac

      - name: Collect the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: image/.build/pass1/*.manifest
          if-no-files-found: warn

      # image.seal is here so it can be downloaded and signed off the build machine — that download
      # is step 2 of the seal flow in image/seal.sh.
      - name: Collect the artifact hashes and the seal record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes
          path: |
            image/.build/pass1.sha256
            image/.build/pass2.sha256
            image/.build/diff.txt
            image/.build/image.seal
          if-no-files-found: warn
