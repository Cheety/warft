# AP-0.2 — the CI leg that builds every image twice and compares the artifacts.
#
# This workflow is the only place where AB-A03-2 can turn green: reproducibility is a property of a
# run, not of a configuration file. It fails the build when the two passes differ, so the row cannot
# quietly go unnoticed.
#
# It runs in a Fedora container because mkosi builds Fedora images with Fedora's own package
# tooling, and E-01 rules that the security pipeline stays with Fedora.
#
# mkosi itself is pinned to the version in image/tool-version and taken from its own repository,
# not from `dnf install mkosi`. Two reasons, and the second is the important one:
#   1. Fedora 43 ships 25.3, which lacks settings this configuration uses.
#   2. The build tool is an input to the artifact. A distribution update to mkosi would change the
#      output and break the very claim this leg exists to make. Pinning the packages while leaving
#      the tool floating would be half a pin.
# The distribution package is still installed, for its dependencies.

name: image

# The acceptance scripts are trigger paths because they decide this run's verdict: a change to a
# check must re-run the check, or the registry row it feeds rests on a run of the old one. The
# ruling in decisions/E-05.md and its machine-readable half are triggers for the same reason — the
# calibration run holds the recorded constants against a fresh measurement, so editing a constant
# has to re-measure it.
on:
  push:
    paths:
      - 'image/**'
      - 'platform/**'
      - 'acceptance/e01-kernel.sh'
      - 'acceptance/a02-roles.sh'
      - 'acceptance/a06-acceptance.sh'
      - 'acceptance/a04-boot.sh'
      - 'acceptance/e02-binary.sh'
      - 'acceptance/calibration.sh'
      - 'acceptance/calibration-probe.sh'
      - 'acceptance/e05-constants.tsv'
      - 'decisions/E-05.md'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'image/**'
      - 'platform/**'
      - 'acceptance/e01-kernel.sh'
      - 'acceptance/a02-roles.sh'
      - 'acceptance/a06-acceptance.sh'
      - 'acceptance/a04-boot.sh'
      - 'acceptance/e02-binary.sh'
      - 'acceptance/calibration.sh'
      - 'acceptance/calibration-probe.sh'
      - 'acceptance/e05-constants.tsv'
      - 'decisions/E-05.md'
      - '.github/workflows/image.yml'
  workflow_dispatch:

jobs:
  reproducible:
    runs-on: ubuntu-latest
    container:
      image: fedora:43
      # mkosi assembles a disk image: it needs loop devices and mount, which the default container
      # profile denies.
      options: --privileged
    steps:
      # Weak dependencies are installed deliberately: mkosi's recommends are its toolchain, and this
      # is the build container, not the image. SP-A02-3's "no toolchains" is a property of what is
      # built, not of what builds it. distribution-gpg-keys is named explicitly because mkosi asks
      # for it by name when a repository signature cannot be checked.
      #
      # The rest are the tools the partitions and the boot path need, each for one file of the
      # image: erofs-utils for the root filesystem, dosfstools and mtools for the ESP,
      # systemd-ukify to assemble the unified kernel image mkosi puts the verity roothash into.
      # qemu and edk2-ovmf are for the checks that boot the result (AP-1.1's "done when").
      #
      # util-linux is named for AB-A06-7's drill: the damage has to go into the root partition, and
      # `sfdisk` is what says where that partition begins. The base container ships util-linux-core,
      # which does not carry it.
      #
      # golang builds the platform binary (SP-E02-1) — a dependency of the build environment, never
      # of the image (SP-A02-3: no toolchains on the host). swtpm gives the boot checks' machine a
      # TPM 2.0, so the disk step's binding of /var (SP-A05-4) runs against a real device instead
      # of falling back.
      - name: Install the build dependencies
        run: >
          dnf -y install mkosi git-core systemd-udev distribution-gpg-keys openssl
          erofs-utils dosfstools mtools systemd-ukify util-linux
          qemu-system-x86-core edk2-ovmf golang swtpm

      # fetch-depth: 0 because build.sh dates the image from the last commit that touched image/,
      # not from HEAD. A shallow checkout has one commit, and on a run triggered by a change to this
      # workflow that commit does not touch image/ — the build would then have no date at all.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Pin mkosi to the version in image/tool-version
        run: |
          set -eu
          v="$(cat image/tool-version)"
          git clone --depth 1 --branch "v$v" https://github.com/systemd/mkosi /opt/mkosi
          echo /opt/mkosi/bin >> "$GITHUB_PATH"

      - name: Build twice and compare
        run: ./image/build.sh

      # No signing key is available here and none is wanted: decisions/signing-key.md keeps the
      # private half off every build machine, so this leg verifies with the committed certificate
      # alone. Exit 2 means the revision has not been sealed yet, which is the normal state while
      # the image is still being built (AP-1.1) — it is reported, not failed. Exit 1 means a seal
      # exists and does not hold, and that must stop the run.
      - name: Verify the seal
        run: |
          set +e
          ./image/verify.sh
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::AB-A03-7 evidenced by this run — SBOM and signature verified" ;;
            2) echo "::warning::image unsealed for this revision — AB-A03-7 stays red (image/seal.sh)" ;;
            *) echo "::error::the seal does not hold"; exit 1 ;;
          esac

      # AP-1.1's two rows. Both boot the image that was just built, ephemerally, and run their check
      # inside it — E-11's "A-06 as a script against a bare mkosi VM", one work package early. The
      # image is not modified: the seal above is over these same bytes.
      #
      # Whether /dev/kvm is reachable inside this container decides only how long they take; mkosi
      # falls back to software emulation on its own.
      - name: AB-E01-1 — the kernel against image/kernel-requirements.conf
        run: ./acceptance/e01-kernel.sh

      - name: AB-A02-1 — four roles, one artifact
        run: ./acceptance/a02-roles.sh

      # AP-3.1's two host-side and four boot-side checks. The binary check reads the artifact
      # build.sh staged for mkosi; the boots run the A-04 sequence in the machine — to a
      # registered node, through a reinstall, against a withheld boot value, and past a selftest
      # that must refuse.
      - name: AB-E02-1 — one Go binary
        run: ./acceptance/e02-binary.sh

      - name: AB-A04-*, AB-A05-1, AB-RC-4, AB-V01-1 — the A-04 sequence in the machine
        run: ./acceptance/a04-boot.sh

      # AP-1.2. A-06 in full: the list runs in the machine, the SBOM is read next to the artifact,
      # and a deliberately damaged copy of the image is booted to see it refuse. Eight rows green,
      # five open with the work package that closes them, no red — that is the work package's
      # "done when", said by a run.
      - name: AB-A06-* — the acceptance list of the image
        run: ./acceptance/a06-acceptance.sh

      # AP-1.3, the measurement stage 1 ends with. Two more boots of the same artifact, this time on
      # a machine with 6 GB and 4 cores: 500 pods created, 20 of them working, and the five constants
      # of E-05 measured instead of assumed. The runner has 16 GB and 4 cores in total, so the guest
      # takes what it needs and no more — and every number the run prints carries the machine with it.
      - name: AB-A06-13, AB-A06-4, AB-E05-1 — the calibration run
        run: ./acceptance/calibration.sh

      - name: Collect the SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: image/.build/pass1/*.manifest
          if-no-files-found: warn

      # image.seal is here so it can be downloaded and signed off the build machine — that download
      # is step 2 of the seal flow in image/seal.sh.
      - name: Collect the artifact hashes and the seal record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hashes
          path: |
            image/.build/pass1.sha256
            image/.build/pass2.sha256
            image/.build/diff.txt
            image/.build/image.seal
          if-no-files-found: warn
