# AP-3.2 — the leg that holds intake to its own rules (AB-T01-7, AB-K01-6).
#
# The image leg already builds the binary and boots it; this one is the fast half, and it is where
# the two rows of this work package turn green. It does three things, in order of what they cost:
#
#   1. the unit tests of the modules AP-3.2 added — the OP-5 policy, the adapter's four methods,
#      the identifiers the state contract demands (SP-K01-2)
#   2. the module contract, because a new module is a change to decisions/module-dependencies.md
#      and the check is what makes that a rule rather than a habit
#   3. acceptance/t01-intake.sh — a real Postgres 16 with contract/schema.sql, the real control
#      plane against it, and the real `workpod adapter submit` twice with one message id
#
# The acceptance script and the ruling it reads are trigger paths for the same reason they are
# everywhere else in this repository: a check that does not re-run rests on a run of the old one.

name: platform

on:
  push:
    paths:
      - 'platform/**'
      - 'contract/schema.sql'
      - 'contract/platform.proto'
      - 'acceptance/t01-intake.sh'
      - 'acceptance/t05-pipeline.sh'
      - 'acceptance/k03-outbox.sh'
      - 'acceptance/v04-budget.sh'
      - 'acceptance/rb-scheduler.sh'
      - 'acceptance/b03-observation.sh'
      - 'acceptance/module-contract.py'
      - 'decisions/OP-1.md'
      - 'decisions/OP-2.md'
      - 'decisions/OP-5.md'
      - 'decisions/OP-6.md'
      - 'decisions/aging.md'
      - 'decisions/alerts.md'
      - 'decisions/escalation-ladder.md'
      - 'decisions/gates-and-the-outbox.md'
      - 'decisions/halt-file.md'
      - 'decisions/jobs-by-hand.md'
      - 'decisions/module-dependencies.md'
      - 'decisions/phase-tokens.md'
      - 'decisions/pod-runtime.md'
      - 'decisions/resource-contract.md'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'contract/schema.sql'
      - 'contract/platform.proto'
      - 'acceptance/t01-intake.sh'
      - 'acceptance/t05-pipeline.sh'
      - 'acceptance/k03-outbox.sh'
      - 'acceptance/v04-budget.sh'
      - 'acceptance/rb-scheduler.sh'
      - 'acceptance/b03-observation.sh'
      - 'acceptance/module-contract.py'
      - 'decisions/OP-1.md'
      - 'decisions/OP-2.md'
      - 'decisions/OP-5.md'
      - 'decisions/OP-6.md'
      - 'decisions/aging.md'
      - 'decisions/alerts.md'
      - 'decisions/escalation-ladder.md'
      - 'decisions/gates-and-the-outbox.md'
      - 'decisions/halt-file.md'
      - 'decisions/jobs-by-hand.md'
      - 'decisions/module-dependencies.md'
      - 'decisions/phase-tokens.md'
      - 'decisions/pod-runtime.md'
      - 'decisions/resource-contract.md'
      - '.github/workflows/platform.yml'
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go version is the one platform/go.mod names; check-latest would make the toolchain a
      # floating input of a build whose artifact the image seals.
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: The modules and their tests
        working-directory: platform
        run: |
          test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
          go vet ./...
          go test ./...

      - name: The module contract against the imports
        run: ./acceptance/module-contract.py

      # AP-3.4's host half: T-05's spine against the panel that names it, the seven places against
      # SP-T05-2's prose, OP-2's ceilings against the file the binary embeds, and the acceptance
      # criterion against the state contract's evidence classes. It needs no machine, so it runs
      # here on every change rather than only in the leg that boots one — the boot itself, which is
      # where AB-T05-* turn green, is in image.yml.
      - name: T-05's four sources against the program
        run: ./acceptance/t05-pipeline.sh host

      # AP-3.5. The whole of K-03's chain, and it needs no machine: the gates are processes on
      # Unix sockets, the repository is a bare one this runner creates, and the pushes are counted
      # with git. This is where AB-K03-*, AB-A06-11, AB-B01-4 and AB-B02-* turn green.
      - name: The outbox, both gates, and one push out of two attempts
        run: ./acceptance/k03-outbox.sh

      # ubuntu-latest carries docker; the script spins its own Postgres, the same shape the
      # state-machine leg of the contract workflow uses.
      - name: Intake, its idempotency and its attachments
        run: ./acceptance/t01-intake.sh

      # AP-3.6. OP-1's caps against the file the binary embeds, and then the whole of V-04 against a
      # real state database: the reservation at admission, the release at the terminal state, the
      # channel limit in pod minutes, the refusal that answers with options, the share-out of the
      # bottleneck, and the halt file deciding with the plane stopped. This is where AB-V04-1,
      # AB-V04-2, AB-V04-4, AB-T01-8 and AB-E08-3 turn green.
      - name: The pots, the caps, the share-out and the halt with two paths
        run: ./acceptance/v04-budget.sh

      # AP-3.7. R-B and R-C, whole: the rulings against the tables the binary carries, a replayed
      # pressure series that climbs all five rungs in order without aborting anything, and then the
      # queue against a real Postgres — two claims that skip each other's rows, a job frozen and
      # thawed with everything but its slot, and three recorded runs that make admission mechanical.
      # This is where AB-RB-1 through AB-RB-5, AB-RC-1, AB-RC-3, AB-RC-6, AB-RD-3, AB-E05-2,
      # AB-V01-4, AB-E02-2 and AB-E02-5 turn green.
      - name: The scheduler — tokens per phase, aging, the ladder and the queue
        run: ./acceptance/rb-scheduler.sh

      # AB-A06-9 asks for one job from the envelope to the patch *on one machine*, and the machine
      # it asks for is a node: the pod is a runc container on a btrfs snapshot and SP-T04-1 admits
      # of no cheaper substitute. A build runner is not a node, but it can be laid out like one —
      # a loopback btrfs where /data/work belongs (SP-A05-1) and runc in the path — and then the
      # pod half of the chain is a real pod rather than a skipped row.
      #
      # user_subvol_rm_allowed is there for the reaper: it deletes the working copy's subvolume at
      # the end of every pod (SP-T04-5), and without the mount option that deletion is root-only in
      # a way that also refuses the pod directory's owner.
      #
      # Nothing is installed that is already there, and the reason is not thrift. `apt-get install
      # runc` on a runner that has docker *removes docker*: containerd depends on its own runc, apt
      # resolves the conflict by taking containerd out, and the next step then found no docker,
      # skipped every check that needs a database, and reported success having measured half of
      # what it measures. The assertion at the end is what makes that mistake fail instead of pass.
      - name: A node's work disk on the runner, so the pod can be a pod
        run: |
          set -eu
          command -v runc       >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq runc; }
          command -v mkfs.btrfs >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq btrfs-progs; }
          sudo mkdir -p /data /etc/systemd/system.conf.d
          sudo truncate -s 8G /data/work.img
          sudo mkfs.btrfs -q /data/work.img
          sudo mkdir -p /data/work
          sudo mount -o loop,user_subvol_rm_allowed /data/work.img /data/work
          runc --version
          stat -f -c '/data/work is %T' /data/work
          docker info >/dev/null 2>&1 || { echo "::error::docker is gone — the database half would skip"; exit 1; }

          # The node's own slice units, not a copy of their contents. A pod is a scope under
          # workpod-work.slice, and that slice carries IOAccounting=yes for one reason: a cgroup only
          # has an io.latency file when the io controller is enabled in its parent, so without the
          # slice the pod would carry four of R-A's five knobs and fail writing the fifth (SP-RA-4).
          # That is what the first run of this leg did.
          sudo cp image/mkosi.extra/usr/lib/systemd/system/workpod*.slice /etc/systemd/system/

          # A pod's cgroup is a transient scope, and it only has an io.latency file when the io
          # controller is enabled in workpod-work.slice's subtree_control. The slice's own
          # IOAccounting=yes enables io one level higher — in workpod.slice, so that the work slice
          # can be accounted — and this runner's systemd does not carry it further down for a
          # transient scope that asks for nothing. Accounting every unit does, and it is a property
          # of the machine rather than of the platform, which is why it is set here and not in a unit.
          printf '[Manager]\nDefaultIOAccounting=yes\n' \
            | sudo tee /etc/systemd/system.conf.d/10-workpod-io.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl daemon-reexec

          # What this leg still cannot give the pod is a kernel with io.latency: a GitHub runner's
          # kernel is built without BLK_CGROUP_IOLATENCY, so the scope gets io.max, io.weight and
          # io.stat and no io.latency, and R-A's fifth knob has nowhere to go (SP-RA-4). Everything
          # above is what a node needs and this machine can have; the ruling in
          # decisions/a06-9-one-machine.md is what the missing knob means for AB-A06-9, and the day
          # this leg runs on a machine whose kernel carries it, the row turns green with no change
          # here.
          echo "io.latency in this kernel: $(find /sys/fs/cgroup -maxdepth 2 -name io.latency -print -quit 2>/dev/null || echo none)"

      # AP-3.8. B-03, whole: the alert catalog held against its ruling and against the seed the cell
      # carries, a fifth waking alert refused by the state contract, one job from the channel message
      # to a pushed patch with its trace, its pod log and its refused targets, and the one query that
      # puts the chain back together from either end. This is where AB-B03-1, AB-B03-3, AB-B03-4,
      # AB-K01-7, AB-Q04-4, AB-RD-2, AB-B02-5, AB-A05-5 and AB-A06-9 turn green.
      #
      # Not run as root: the script elevates the four pod commands itself and leaves the rest — the
      # Postgres in docker, the control plane, the gates — with the user whose session set them up.
      # A first attempt ran the whole script under sudo and root could not reach the runner's docker,
      # so the database half skipped and the run went green having measured less. That is the failure
      # mode Q-02 is about, and it is why the privilege is where the requirement is and nowhere else.
      - name: One trace per job, four alerts, and the chain in one query
        run: ./acceptance/b03-observation.sh
