# AP-3.2 — the leg that holds intake to its own rules (AB-T01-7, AB-K01-6).
#
# The image leg already builds the binary and boots it; this one is the fast half, and it is where
# the two rows of this work package turn green. It does three things, in order of what they cost:
#
#   1. the unit tests of the modules AP-3.2 added — the OP-5 policy, the adapter's four methods,
#      the identifiers the state contract demands (SP-K01-2)
#   2. the module contract, because a new module is a change to decisions/module-dependencies.md
#      and the check is what makes that a rule rather than a habit
#   3. acceptance/t01-intake.sh — a real Postgres 16 with contract/schema.sql, the real control
#      plane against it, and the real `workpod adapter submit` twice with one message id
#
# The acceptance script and the ruling it reads are trigger paths for the same reason they are
# everywhere else in this repository: a check that does not re-run rests on a run of the old one.

name: platform

on:
  push:
    paths:
      - 'platform/**'
      - 'contract/schema.sql'
      - 'contract/platform.proto'
      - 'acceptance/t01-intake.sh'
      - 'acceptance/t05-pipeline.sh'
      - 'acceptance/k03-outbox.sh'
      - 'acceptance/v04-budget.sh'
      - 'acceptance/rb-scheduler.sh'
      - 'acceptance/module-contract.py'
      - 'decisions/OP-1.md'
      - 'decisions/OP-2.md'
      - 'decisions/OP-5.md'
      - 'decisions/OP-6.md'
      - 'decisions/aging.md'
      - 'decisions/escalation-ladder.md'
      - 'decisions/gates-and-the-outbox.md'
      - 'decisions/halt-file.md'
      - 'decisions/jobs-by-hand.md'
      - 'decisions/module-dependencies.md'
      - 'decisions/phase-tokens.md'
      - 'decisions/pod-runtime.md'
      - 'decisions/resource-contract.md'
      - '.github/workflows/platform.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'contract/schema.sql'
      - 'contract/platform.proto'
      - 'acceptance/t01-intake.sh'
      - 'acceptance/t05-pipeline.sh'
      - 'acceptance/k03-outbox.sh'
      - 'acceptance/v04-budget.sh'
      - 'acceptance/rb-scheduler.sh'
      - 'acceptance/module-contract.py'
      - 'decisions/OP-1.md'
      - 'decisions/OP-2.md'
      - 'decisions/OP-5.md'
      - 'decisions/OP-6.md'
      - 'decisions/aging.md'
      - 'decisions/escalation-ladder.md'
      - 'decisions/gates-and-the-outbox.md'
      - 'decisions/halt-file.md'
      - 'decisions/jobs-by-hand.md'
      - 'decisions/module-dependencies.md'
      - 'decisions/phase-tokens.md'
      - 'decisions/pod-runtime.md'
      - 'decisions/resource-contract.md'
      - '.github/workflows/platform.yml'
  workflow_dispatch:

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go version is the one platform/go.mod names; check-latest would make the toolchain a
      # floating input of a build whose artifact the image seals.
      - uses: actions/setup-go@v5
        with:
          go-version-file: platform/go.mod

      - name: The modules and their tests
        working-directory: platform
        run: |
          test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
          go vet ./...
          go test ./...

      - name: The module contract against the imports
        run: ./acceptance/module-contract.py

      # AP-3.4's host half: T-05's spine against the panel that names it, the seven places against
      # SP-T05-2's prose, OP-2's ceilings against the file the binary embeds, and the acceptance
      # criterion against the state contract's evidence classes. It needs no machine, so it runs
      # here on every change rather than only in the leg that boots one — the boot itself, which is
      # where AB-T05-* turn green, is in image.yml.
      - name: T-05's four sources against the program
        run: ./acceptance/t05-pipeline.sh host

      # AP-3.5. The whole of K-03's chain, and it needs no machine: the gates are processes on
      # Unix sockets, the repository is a bare one this runner creates, and the pushes are counted
      # with git. This is where AB-K03-*, AB-A06-11, AB-B01-4 and AB-B02-* turn green.
      - name: The outbox, both gates, and one push out of two attempts
        run: ./acceptance/k03-outbox.sh

      # ubuntu-latest carries docker; the script spins its own Postgres, the same shape the
      # state-machine leg of the contract workflow uses.
      - name: Intake, its idempotency and its attachments
        run: ./acceptance/t01-intake.sh

      # AP-3.6. OP-1's caps against the file the binary embeds, and then the whole of V-04 against a
      # real state database: the reservation at admission, the release at the terminal state, the
      # channel limit in pod minutes, the refusal that answers with options, the share-out of the
      # bottleneck, and the halt file deciding with the plane stopped. This is where AB-V04-1,
      # AB-V04-2, AB-V04-4, AB-T01-8 and AB-E08-3 turn green.
      - name: The pots, the caps, the share-out and the halt with two paths
        run: ./acceptance/v04-budget.sh

      # AP-3.7. R-B and R-C, whole: the rulings against the tables the binary carries, a replayed
      # pressure series that climbs all five rungs in order without aborting anything, and then the
      # queue against a real Postgres — two claims that skip each other's rows, a job frozen and
      # thawed with everything but its slot, and three recorded runs that make admission mechanical.
      # This is where AB-RB-1 through AB-RB-5, AB-RC-1, AB-RC-3, AB-RC-6, AB-RD-3, AB-E05-2,
      # AB-V01-4, AB-E02-2 and AB-E02-5 turn green.
      - name: The scheduler — tokens per phase, aging, the ladder and the queue
        run: ./acceptance/rb-scheduler.sh
