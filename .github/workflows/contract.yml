# AP-2.1 through AP-2.3 — the legs that hold the contract to its own rules (AB-E10-1, AB-E10-3,
# AB-E10-5, AB-T04-4 · AB-K01-1 through AB-K01-5, AB-V05-2 · AB-K02-1, AB-K02-2, AB-K02-3,
# AB-K02-5).
#
# SP-E10-3 and SP-V05-2 say the migration rules are enforced in CI — this is that enforcement,
# in two halves per schema:
#   1. The probes: a scratch copy of the contract is mutated and the linter must reject it. That
#      is AB-E10-3 and AB-V05-2, and it runs on every change so a linter cannot rot unnoticed.
#   2. The baseline comparison: the pushed contract against the contract as it stood before the
#      push. For the proto, each step being additive against its predecessor is only transitive
#      because the linter also forbids lifting a reservation; for the SQL schema, removal has no
#      lawful death at all, so stepwise-additive is transitive by itself.
#
# AP-2.3's leg loads the schema into a Postgres 16 and probes the K-02 state machine there: the
# wrong writer, the missing cause and the exit from a terminal state must fail in the database,
# not in any application.
#
# The acceptance scripts are trigger paths because they decide this run's verdict: a change to a
# check must re-run the check, or the registry row it feeds rests on a run of the old one.

name: contract

on:
  push:
    paths:
      - 'contract/platform.proto'
      - 'contract/schema.sql'
      - 'contract/authority.md'
      - 'acceptance/e10-additive.py'
      - 'acceptance/e10-schema.sh'
      - 'acceptance/schema-additive.py'
      - 'acceptance/k01-schema.sh'
      - 'acceptance/k02-state.sh'
      - 'acceptance/k04-authority.sh'
      - 'acceptance/k04-authority.py'
      - 'contract/identity.md'
      - 'acceptance/b01-identity.sh'
      - 'decisions/OP-4.md'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'contract/platform.proto'
      - 'contract/schema.sql'
      - 'contract/authority.md'
      - 'acceptance/e10-additive.py'
      - 'acceptance/e10-schema.sh'
      - 'acceptance/schema-additive.py'
      - 'acceptance/k01-schema.sh'
      - 'acceptance/k02-state.sh'
      - 'acceptance/k04-authority.sh'
      - 'acceptance/k04-authority.py'
      - 'contract/identity.md'
      - 'acceptance/b01-identity.sh'
      - 'decisions/OP-4.md'
      - '.github/workflows/contract.yml'
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline comparison reaches into history; a shallow clone would have none.
          fetch-depth: 0

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: The schema and its probes
        run: ./acceptance/e10-schema.sh

      - name: Additive against the baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # A forced or freshly created ref has no before-commit to stand against. The probes
            # above still ran; only the baseline half has nothing to compare.
            echo "no baseline commit ($BASE) — nothing to compare against"
            exit 0
          fi
          if ! git cat-file -e "$BASE:contract/platform.proto" 2>/dev/null; then
            echo "the contract did not exist at $BASE — its first version is additive by definition"
            exit 0
          fi
          git show "$BASE:contract/platform.proto" > "$RUNNER_TEMP/platform-baseline.proto"
          ./acceptance/e10-additive.py "$RUNNER_TEMP/platform-baseline.proto" contract/platform.proto

  state-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline comparison reaches into history; a shallow clone would have none.
          fetch-depth: 0

      - name: The state schema and its probes
        run: ./acceptance/k01-schema.sh

      - name: The state machine and its probes
        run: ./acceptance/k02-state.sh

      - name: Additive against the baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # A forced or freshly created ref has no before-commit to stand against. The probes
            # above still ran; only the baseline half has nothing to compare.
            echo "no baseline commit ($BASE) — nothing to compare against"
            exit 0
          fi
          if ! git cat-file -e "$BASE:contract/schema.sql" 2>/dev/null; then
            echo "the schema did not exist at $BASE — its first version is additive by definition"
            exit 0
          fi
          git show "$BASE:contract/schema.sql" > "$RUNNER_TEMP/schema-baseline.sql"
          ./acceptance/schema-additive.py "$RUNNER_TEMP/schema-baseline.sql" contract/schema.sql

  authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The probe runs the real Biscuit library in a pinned container it spins itself — the same
      # shape as the state-machine leg reaching for a Postgres. ubuntu-latest carries docker.
      - name: The authority token and its probes
        run: ./acceptance/k04-authority.sh

  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AP-2.5's leg (AB-B01-3): the node certificate's name is checked as a statement — chain,
      # exactly one workpod URI SAN, then the certified name beats every claim beside it — and the
      # mTLS handshake is exercised in both directions. Runs on openssl alone; every key is
      # ephemeral, minted inside the probe's scratch directory.
      - name: The node identity and its probes
        run: ./acceptance/b01-identity.sh
